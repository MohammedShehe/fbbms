<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FBBMS</title>
<meta name="theme-color" content="#0c0c0f">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app" style="visibility:hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brand"></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">FBBMS v2 · Four Brothers<br><span id="tzNote">East Africa Time (GMT+3)</span></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn d-lg-none" id="menuBtn" aria-label="Menu"><i class="bi bi-list fs-5"></i></button>
      <div class="dropdown" id="bizWrap"></div>
      <div class="grow"></div>
      <div class="clock d-none d-sm-block"><div class="t" id="clockT">--:--:--</div><div class="d" id="clockD"></div></div>
      <span class="d-none d-md-inline small muted"><span class="live-dot" id="liveDot"></span><span id="liveTxt">Connecting…</span></span>
      <div class="dropdown"><button class="icon-btn" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-label="Notifications"><i class="bi bi-bell"></i><span class="count d-none" id="bellCount">0</span></button>
        <div class="dropdown-menu dropdown-menu-end notif-menu p-2" id="notifMenu"></div></div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"><i class="bi bi-moon-stars"></i></button>
      <div class="dropdown" id="userWrap"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
