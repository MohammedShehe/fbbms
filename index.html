<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FBBMS · Sign in</title>
<meta name="theme-color" content="#0c0c0f">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<main class="auth">
  <div class="auth-card">
    <div class="text-center mb-3">
      <div class="logo-anim glow" style="width:92px;--logo-mask:url(assets/fbbms-logo.svg)"><img src="assets/fbbms-logo.svg" alt="FBBMS"></div>
      <h1 class="h4 mt-3 mb-0" style="font-family:var(--font-display)" id="platName">FBBMS</h1>
      <div class="brand-sub">Four Brothers Business Management</div>
    </div>

    <div id="stepLogin">
      <p class="text-center muted mb-3" id="loginHello">Welcome back 👋 sign in to manage your business.</p>
      <div class="alert-fb bad mb-3 d-none" id="err"><i class="bi bi-exclamation-circle"></i><span id="errText"></span></div>
      <form id="loginForm" novalidate>
        <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" type="email" class="form-control form-control-lg" autocomplete="username" placeholder="you@business.online" required></div>
        <div class="mb-3"><label class="form-label" for="pw">Password</label>
          <div class="position-relative"><input id="pw" type="password" class="form-control form-control-lg pe-5" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y text-muted" id="eye" tabindex="-1"><i class="bi bi-eye"></i></button></div></div>
        <button class="btn btn-fb btn-lg w-100" id="loginBtn" type="submit"><span class="label">Sign in</span></button>
      </form>
    </div>

    <div id="stepOtp" class="d-none">
      <p class="text-center muted">We sent a 6-digit code to <b id="otpEmail"></b>. Enter it below 🔐</p>
      <div class="alert-fb bad mb-3 d-none" id="err2"><i class="bi bi-exclamation-circle"></i><span id="errText2"></span></div>
      <div class="otp-inputs mb-3" id="otpBoxes"></div>
      <button class="btn btn-fb btn-lg w-100" id="otpBtn"><span class="label">Verify & continue</span></button>
      <div class="d-flex justify-content-between mt-3 small"><a href="#" id="backLink">← Back</a><a href="#" id="resend">Resend code</a></div>
    </div>

    <p class="text-center muted small mt-4 mb-0">Protected access · Never share your password.<br>© <span id="yr"></span> Four Brothers</p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
